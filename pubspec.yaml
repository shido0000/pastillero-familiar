name: pastillero_familiar
description: Recordatorios de medicamentos para toda la familia, 100% offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Estado e inyección de dependencias
  flutter_riverpod: ^2.5.1
  # Base de datos local (SQLite tipado, con migraciones)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  # Navegación declarativa
  go_router: ^14.2.0
  # Preferencias locales (tema, accesibilidad, onboarding)
  shared_preferences: ^2.2.3
  # Foto de perfil
  image_picker: ^1.1.2
  # Notificaciones locales programadas (100% offline)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # PDF offline
  pdf: ^3.11.0
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generador de código Drift
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

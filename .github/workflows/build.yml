# Compila la APK automáticamente en cada push a main.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
          with:
            channel: stable

      # Genera las carpetas nativas android/ e ios/ (no se versionan).
      - name: Generar carpetas nativas
        run: flutter create . --platforms android,ios --org com.jonyperez --project-name pastillero_familiar

      # Permisos y receptores de notificaciones en el AndroidManifest.
      - name: Configurar AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n            <uses-permission android:name="android.permission.VIBRATE"/>\n            <uses-permission android:name="android.permission.WAKE_LOCK"/>\n            <application|' "$MANIFEST"
          sed -i 's|</application>|<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n            <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>\n    </application>|' "$MANIFEST"

      - name: Dependencias
        run: flutter pub get

      - name: Generar código Drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Tests
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pastillero-familiar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

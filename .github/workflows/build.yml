# Compila la APK automáticamente en cada push a main.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera las carpetas nativas (no se guardan en el repo).
      - name: Generar proyecto Android
        run: flutter create . --platforms android --project-name pastillero_familiar --org com.jonyperez

      # Permisos y receptores de notificaciones en el manifest generado.
      - name: Configurar permisos de notificaciones
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <manifest|' $MANIFEST
          sed -i 's|android:icon="@mipmap/ic_launcher">|android:icon="@mipmap/ic_launcher">\n            <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n            <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n                <intent-filter>\n                    <action android:name="android.intent.action.BOOT_COMPLETED" />\n                    <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                </intent-filter>\n            </receiver>|' $MANIFEST

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pastillero-familiar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
